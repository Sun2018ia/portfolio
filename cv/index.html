<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV – Sonia EL HENDI</title>
<style>
  html,body{margin:0;background:#E9EEF0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0E2A3A}
  header{max-width:794px;margin:0 auto;padding:24px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header a{color:#0B4F6C;font-weight:700;text-decoration:none}
  header span{font-size:14px;color:#4A6170}
  .page{width:794px;height:1123px;margin:16px auto;box-shadow:0 10px 30px rgba(14,42,58,.18);background:#fff;transform-origin:top left;overflow:hidden}
  .page iframe{width:794px;height:1123px;border:0;display:block}
  .wrap{margin:0 auto 24px}
</style>
</head>
<body>
<header><a href="../index.html">← Retour au portfolio</a><span>CV – 2 pages</span></header>
<div class="wrap"><div class="page"><iframe src="Main.dc.html" title="CV – page 1" scrolling="no"></iframe></div></div>
<div class="wrap"><div class="page"><iframe src="CV-2.dc.html" title="CV – page 2" scrolling="no"></iframe></div></div>
<script>
  function fit(){
    var s=Math.min(1,(window.innerWidth-16)/794);
    document.querySelectorAll('.page').forEach(function(p){p.style.transform='scale('+s+')';p.style.marginLeft=s<1?'8px':'auto';p.parentNode.style.height=(1123*s+32)+'px';p.parentNode.style.width=s<1?'auto':'794px';});
  }
  window.addEventListener('resize',fit);fit();
</script>
</body>
</html>
